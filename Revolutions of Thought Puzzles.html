<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Revolutions of Thought Puzzles</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one centered play column; day tabs, then a game switcher, then the active board. Observatory palette: midnight ink, brass, verdigris, copper, indigo. */
:root{
  --bg:#eef2f2; --surface:#ffffff; --ink:#14232b; --muted:#53666e; --line:#c8d4d6;
  --lapis:#2b4a8a; --saffron:#c08a2a; --jade:#2c8577; --plum:#a4532f;
  --tile-empty:#ffffff; --tile-absent:#748a90; --key:#dbe4e5; --key-ink:#18213a;
  --display:"Cormorant SC", "Palatino Linotype", Georgia, serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d171c; --surface:#16242b; --ink:#e6eeee; --muted:#93a8ae; --line:#2a3d45;
  --lapis:#6f93d8; --saffron:#d9a441; --jade:#40a595; --plum:#c9714a;
  --tile-empty:#16242b; --tile-absent:#3b4f57; --key:#25363e; --key-ink:#e8ecf6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d171c; --surface:#16242b; --ink:#e6eeee; --muted:#93a8ae; --line:#2a3d45;
  --lapis:#6f93d8; --saffron:#d9a441; --jade:#40a595; --plum:#c9714a;
  --tile-empty:#16242b; --tile-absent:#3b4f57; --key:#25363e; --key-ink:#e8ecf6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{text-align:center;display:flex;flex-direction:column;gap:4px}
.band{height:10px;border-radius:2px;background:
  repeating-linear-gradient(90deg,var(--saffron) 0 2px,transparent 2px 12px),linear-gradient(90deg,var(--lapis),var(--jade))}
h1{font-family:var(--display);font-size:2.5rem;line-height:1.05;margin:10px 0 0;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:.95rem}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.day{border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 18px;border-radius:999px;font-weight:700}
.day[aria-selected="true"]{background:var(--lapis);border-color:var(--lapis);color:#fff}
.switch{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.switch button{border:0;background:transparent;color:var(--muted);padding:10px;font-weight:700;font-size:1rem}
.switch button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.panel{display:flex;flex-direction:column;gap:14px;align-items:center}
.msg{min-height:1.6em;font-weight:700;text-align:center}
.small{border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:999px;font-weight:700;font-size:.9rem}
.small:disabled{opacity:.45;cursor:default}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.clue{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.95rem;width:100%}
.clue b{font-family:var(--display);font-size:1.1rem;letter-spacing:.04em}
/* Wordle */
.grid{display:grid;grid-template-rows:repeat(6,1fr);gap:6px}
.wrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tile{width:min(58px,15vw);aspect-ratio:1;max-width:100%;border:2px solid var(--line);background:var(--tile-empty);
  display:grid;place-items:center;font-weight:700;font-size:1.7rem;text-transform:uppercase;border-radius:4px}
.tile.filled{border-color:var(--muted)}
.tile.correct{background:var(--jade);border-color:var(--jade);color:#fff}
.tile.present{background:var(--saffron);border-color:var(--saffron);color:#1a1405}
.tile.absent{background:var(--tile-absent);border-color:var(--tile-absent);color:#fff}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.kb{display:flex;flex-direction:column;gap:6px;width:100%}
.krow{display:flex;gap:5px;justify-content:center}
.key{flex:1;max-width:44px;height:52px;border:0;border-radius:6px;background:var(--key);color:var(--key-ink);font-weight:700;font-size:1rem;padding:0}
.key.wide{max-width:68px;flex:1.5;font-size:.75rem}
.key.correct{background:var(--jade);color:#fff}.key.present{background:var(--saffron);color:#1a1405}.key.absent{background:var(--tile-absent);color:#fff}
.fact{border-left:4px solid var(--lapis);background:var(--surface);padding:12px 14px;border-radius:0 10px 10px 0;width:100%}
/* Connections */
.solved{display:flex;flex-direction:column;gap:8px;width:100%}
.group{border-radius:10px;padding:10px 12px;text-align:center;color:#fff}
.group.l1{background:var(--saffron);color:#1a1405}.group.l2{background:var(--jade)}.group.l3{background:var(--lapis)}.group.l4{background:var(--plum)}
.group h3{margin:0;font-family:var(--display);font-size:1.25rem;letter-spacing:.04em}
.group p{margin:2px 0 0;font-size:.85rem}
.group .items{font-weight:700;font-size:.95rem}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%}
.card{border:0;border-radius:10px;background:var(--key);color:var(--key-ink);min-height:70px;padding:6px 4px;font-weight:700;
  font-size:clamp(.72rem,2.9vw,.95rem);line-height:1.15;overflow-wrap:anywhere;transition:transform .1s}
.card.sel{background:var(--ink);color:var(--bg)}
.card:active{transform:scale(.96)}
.dots{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:.9rem}
.dot{width:12px;height:12px;border-radius:50%;background:var(--muted)}
.dot.used{background:transparent;border:2px solid var(--line)}
.legend{font-size:.8rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="band" aria-hidden="true"></div>
    <h1>Revolutions of Thought</h1>
    <p class="sub">Scientific Revolution · Enlightenment</p>
  </header>
  <nav class="tabs" role="tablist" id="days"></nav>
  <div class="switch" role="tablist">
    <button id="tab-wordle" role="tab" aria-selected="true">Wordle</button>
    <button id="tab-conn" role="tab" aria-selected="false">Connections</button>
  </div>
  <section class="panel" id="wordle"></section>
  <section class="panel" id="conn" hidden></section>
</div>

<script>
const DAYS=[
 {label:"Day 1",
  wordle:{answer:"ORBIT",
   clue:"The path a planet travels around the sun. Kepler proved these are ellipses, not perfect circles.",
   fact:"Johannes Kepler used Tycho Brahe's careful observations to show that planets move in elliptical orbits, which supported Copernicus's sun-centered model."},
  groups:[
   {level:1,name:"Steps of the scientific method",desc:"Francis Bacon and René Descartes helped shape this way of testing ideas",items:["Hypothesis","Observation","Experiment","Conclusion"]},
   {level:2,name:"Isaac Newton",desc:"Tied the new science together with universal laws",items:["Gravity","Principia","Calculus","Laws of Motion"]},
   {level:3,name:"Galileo Galilei",desc:"Used observation to back Copernicus, and paid a price",items:["Telescope","Jupiter's Moons","Inquisition","House Arrest"]},
   {level:4,name:"Old authorities that were challenged",desc:"Ancient and medieval ideas the new science overturned",items:["Geocentric Model","Ptolemy","Aristotle","Galen"]}
  ]},
 {label:"Day 2",
  wordle:{answer:"SALON",
   clue:"A gathering in a wealthy Paris home where Enlightenment thinkers met to share and debate new ideas.",
   fact:"Salons were often hosted by women such as Madame Geoffrin, and they helped spread Enlightenment ideas across Europe."},
  groups:[
   {level:1,name:"John Locke",desc:"People have rights no government can take away",items:["Natural Rights","Life, Liberty, Property","Two Treatises","Right of Revolution"]},
   {level:2,name:"Montesquieu",desc:"Divide power so no one person or group holds all of it",items:["Separation of Powers","Checks and Balances","Three Branches","The Spirit of the Laws"]},
   {level:3,name:"Voltaire",desc:"Used wit to attack intolerance and censorship",items:["Freedom of Speech","Religious Tolerance","Candide","Satire"]},
   {level:4,name:"Jean-Jacques Rousseau",desc:"Government should follow the will of the people",items:["The Social Contract","General Will","Popular Sovereignty","\"Man Is Born Free\""]}
  ]}
];

const KEY="rot-puzzles-v1";
let store={};
try{store=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){store={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
let dayIdx=0, game="wordle";
try{const d=+localStorage.getItem(KEY+"-day");if(d>=0&&d<DAYS.length)dayIdx=d}catch(e){}

function st(){
  const k="d"+dayIdx;
  if(!store[k]){
    const all=DAYS[dayIdx].groups.flatMap(g=>g.items);
    store[k]={w:{guesses:[],hint:false},c:{order:shuffle(all),solved:[],mistakes:0,sel:[],tried:[]}};
  }
  return store[k];
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const $=id=>document.getElementById(id);
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

/* ---------- Day tabs + switch ---------- */
function renderTabs(){
  $("days").innerHTML=DAYS.map((d,i)=>`<button class="day" role="tab" aria-selected="${i===dayIdx}" data-i="${i}">${d.label}</button>`).join("");
  $("days").querySelectorAll("button").forEach(b=>b.onclick=()=>{dayIdx=+b.dataset.i;try{localStorage.setItem(KEY+"-day",dayIdx)}catch(e){};current="";renderAll()});
}
function setGame(g){game=g;$("tab-wordle").setAttribute("aria-selected",g==="wordle");$("tab-conn").setAttribute("aria-selected",g==="conn");
  $("wordle").hidden=g!=="wordle";$("conn").hidden=g!=="conn"}
$("tab-wordle").onclick=()=>setGame("wordle");$("tab-conn").onclick=()=>setGame("conn");

/* ---------- Wordle ---------- */
let current="", wMsg="";
function score(guess,ans){
  const res=Array(5).fill("absent"),pool={};
  for(let i=0;i<5;i++){if(guess[i]===ans[i])res[i]="correct";else pool[ans[i]]=(pool[ans[i]]||0)+1}
  for(let i=0;i<5;i++){if(res[i]!=="correct"&&pool[guess[i]]){res[i]="present";pool[guess[i]]--}}
  return res;
}
function wState(){const s=st().w,ans=DAYS[dayIdx].wordle.answer;
  const won=s.guesses.includes(ans);return{s,ans,won,done:won||s.guesses.length>=6}}
function renderWordle(shakeRow){
  const {s,ans,won,done}=wState(), w=DAYS[dayIdx].wordle;
  let rows="";
  for(let r=0;r<6;r++){
    const g=s.guesses[r], sc=g?score(g,ans):null, live=!g&&r===s.guesses.length&&!done;
    rows+=`<div class="wrow${live&&shakeRow?" shake":""}">`;
    for(let c=0;c<5;c++){
      const ch=g?g[c]:(live?(current[c]||""):"");
      rows+=`<div class="tile ${sc?sc[c]:(ch?"filled":"")}" aria-label="${ch||"blank"}${sc?" "+sc[c]:""}">${ch}</div>`;
    }
    rows+="</div>";
  }
  const kstate={};
  s.guesses.forEach(g=>score(g,ans).forEach((r,i)=>{const L=g[i],p=kstate[L];
    if(r==="correct"||(r==="present"&&p!=="correct")||(!p))kstate[L]=r}));
  const krows=["QWERTYUIOP","ASDFGHJKL","+ZXCVBNM-"].map(row=>`<div class="krow">${[...row].map(k=>
    k==="+"?`<button class="key wide" data-k="ENTER">ENTER</button>`:
    k==="-"?`<button class="key wide" data-k="BACK" aria-label="Backspace">⌫</button>`:
    `<button class="key ${kstate[k]||""}" data-k="${k}">${k}</button>`).join("")}</div>`).join("");
  let end="";
  if(done) end=`<div class="fact"><strong>${won?"Solved in "+s.guesses.length+"/6!":"The word was "+ans+"."}</strong><br>${esc(w.fact)}</div>`;
  $("wordle").innerHTML=`
    <div class="msg" role="status">${esc(wMsg)}</div>
    <div class="grid">${rows}</div>
    ${s.hint||done?`<div class="clue"><b>Clue</b> · ${esc(w.clue)}</div>`:`<div class="row-btns"><button class="small" id="hint">Show history clue</button></div>`}
    ${end}
    ${done?"":`<div class="kb">${krows}</div>`}
    <p class="legend">Guess the 5-letter word from this unit. Green = right spot, gold = in the word, gray = not in the word.</p>`;
  $("wordle").querySelectorAll(".key").forEach(b=>b.onclick=()=>press(b.dataset.k));
  if($("hint"))$("hint").onclick=()=>{st().w.hint=true;save();renderWordle()};
}
function press(k){
  const {s,ans,done}=wState(); if(done||game!=="wordle")return; wMsg="";
  if(k==="BACK"){current=current.slice(0,-1)}
  else if(k==="ENTER"){
    if(current.length<5){wMsg="Not enough letters";renderWordle(true);return}
    s.guesses.push(current);current="";save();
    if(s.guesses.includes(ans))wMsg=["Eureka!","Brilliant!","Enlightened!","Great!","Nice!","Phew!"][s.guesses.length-1];
  }
  else if(/^[A-Z]$/.test(k)&&current.length<5){current+=k}
  renderWordle();
}
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==="Enter"){if(document.activeElement&&document.activeElement.tagName==="BUTTON"&&!document.activeElement.classList.contains("key"))return;e.preventDefault();press("ENTER")}
  else if(e.key==="Backspace")press("BACK");
  else if(/^[a-zA-Z]$/.test(e.key))press(e.key.toUpperCase());
});

/* ---------- Connections ---------- */
let cMsg="";
function renderConn(){
  const c=st().c, groups=DAYS[dayIdx].groups;
  const lost=c.mistakes>=4, won=c.solved.length===4, done=lost||won;
  const shownGroups=done?[...c.solved,...groups.map((_,i)=>i).filter(i=>!c.solved.includes(i))]:c.solved;
  const solvedHTML=shownGroups.map(i=>{const g=groups[i];return`<div class="group l${g.level}"><h3>${esc(g.name)}</h3><div class="items">${g.items.map(esc).join(", ")}</div><p>${esc(g.desc)}</p></div>`}).join("");
  const solvedItems=new Set(shownGroups.flatMap(i=>groups[i].items));
  const left=c.order.filter(x=>!solvedItems.has(x));
  const dots=[0,1,2,3].map(i=>`<span class="dot ${i<c.mistakes?"used":""}"></span>`).join("");
  $("conn").innerHTML=`
    <div class="msg" role="status">${esc(cMsg)}</div>
    <div class="solved">${solvedHTML}</div>
    ${left.length?`<div class="board">${left.map(x=>`<button class="card ${c.sel.includes(x)?"sel":""}" data-x="${esc(x)}" aria-pressed="${c.sel.includes(x)}">${esc(x)}</button>`).join("")}</div>`:""}
    ${done?`<div class="fact"><strong>${won?"You found every group!":"Out of mistakes."}</strong> ${won?"Mistakes made: "+c.mistakes+".":"All four groups are shown above."}</div>`:
    `<div class="dots">Mistakes left: ${dots}</div>
     <div class="row-btns">
       <button class="small" id="shuf">Shuffle</button>
       <button class="small" id="desel" ${c.sel.length?"":"disabled"}>Deselect all</button>
       <button class="small" id="sub" ${c.sel.length===4?"":"disabled"}>Submit</button>
     </div>`}
    <p class="legend">Find four groups of four. Groups go from easiest (brass) to trickiest (copper).</p>`;
  $("conn").querySelectorAll(".card").forEach(b=>b.onclick=()=>{
    if(done)return;const x=b.dataset.x,i=c.sel.indexOf(x);
    if(i>=0)c.sel.splice(i,1);else if(c.sel.length<4)c.sel.push(x);
    cMsg="";save();renderConn()});
  if(done)return;
  $("shuf").onclick=()=>{c.order=shuffle(c.order);save();renderConn()};
  $("desel").onclick=()=>{c.sel=[];save();renderConn()};
  $("sub").onclick=submit;
}
function submit(){
  const c=st().c,groups=DAYS[dayIdx].groups;
  const key=c.sel.slice().sort().join("|");
  if(c.tried.includes(key)){cMsg="Already guessed!";renderConn();return}
  c.tried.push(key);
  const gi=groups.findIndex(g=>g.items.every(x=>c.sel.includes(x)));
  if(gi>=0){c.solved.push(gi);c.sel=[];cMsg=c.solved.length===4?"Perfect!":""}
  else{
    c.mistakes++;
    const best=Math.max(...groups.map((g,i)=>c.solved.includes(i)?0:g.items.filter(x=>c.sel.includes(x)).length));
    cMsg=c.mistakes>=4?"":(best===3?"One away…":"Not a group");
  }
  save();renderConn();
}

function renderAll(){wMsg="";cMsg="";renderTabs();renderWordle();renderConn();setGame(game)}
renderAll();
</script>

</body></html>
